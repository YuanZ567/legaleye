name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Test (pytest)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 顺序不能反：pnpm 11 要求 Node >=22.13，runner 默认 Node 20；
      # 且 setup-node 的 pnpm 缓存要求 pnpm 已存在，故先 Node 后 pnpm。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package.json 在 frontend/ 子目录，action-setup 读不到根目录 packageManager，
      # 必须显式指定版本（与 frontend/package.json 的 packageManager 一致）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Build
        run: pnpm build
