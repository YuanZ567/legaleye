name: legaleye

services:
  # ── 数据库（Postgres 16 + pgvector 向量扩展）──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legaleye-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis（Celery 队列 / demo 限流 / SSE 进度桥）──
  redis:
    image: redis:7-alpine
    container_name: legaleye-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO（合规文件存储，敏感模式可不持久化）──
  minio:
    image: minio/minio:latest
    container_name: legaleye-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── 后端（FastAPI，M0-4 起构建）──
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: legaleye-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker（消费审查任务队列，M4-3 补上架构缺口）──
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: legaleye-worker
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 前端（React SPA，M0-5 起构建）──
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: legaleye-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
