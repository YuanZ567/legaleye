[project]
name = "legaleye-backend"
version = "0.1.0"
description = "LegalEye 法眼 - 出海企业数据合规智能审查多智能体系统（后端）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web / 配置
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # 数据 / 任务
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    # 安全 / 工具
    "cryptography>=42",
    "loguru>=0.7",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "black>=24",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
